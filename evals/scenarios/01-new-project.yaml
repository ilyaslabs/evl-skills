name: New project documentation
skills: [evl-document]
fixture: shop
setup:
  stripEvl: true
  delete: [evl.yaml, docs/evl]
prompt: >-
  Set up EVL documentation for this project. Use application id "shop". Document the modules,
  the main components, the HTTP endpoint, the data model and the event, using explicit ids.
checks:
  validate: true
  minKinds: { module: 2, component: 2, endpoint: 1, data-model: 1, event: 1 }
  allowedPaths: ["evl.yaml", "docs/**", "src/**"]
  noSecrets: true
