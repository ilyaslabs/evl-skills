name: Resolve validation errors
skills: [evl-validate]
fixture: shop
setup:
  replace:
    - file: docs/evl/order.evl.yaml
      old: "flow: inventory.release"
      new: "flow: inventory.relase"
    - file: docs/evl/order.evl.yaml
      old: "      - id: confirm\n"
      new: "      - id: validate\n"
prompt: Fix the EVL validation errors in this project.
checks:
  validate: true
  maxNewElements: 0
  allowedPaths: ["docs/**"]
