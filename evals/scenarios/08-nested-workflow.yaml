name: Maintain a nested workflow
skills: [evl-workflows, evl-maintain]
fixture: shop
setup:
  write:
    docs/evl/inventory.evl.yaml: |
      evl: "1.0"
      flows:
        - id: inventory.reserve
          steps:
            - { id: lock, type: ACTION, name: Lock stock rows }
            - { id: decrement, type: ACTION, name: Decrement stock }
prompt: >-
  Stock reservation now retries the decrement up to 3 times with exponential backoff when the database
  reports a lock timeout. Update the inventory.reserve flow, which order.placement calls.
checks:
  validate: true
  elements: [inventory.reserve, order.placement]
  maxNewElements: 1
  diffContains: ["RETRY", "maxAttempts:\\s*3"]
  allowedPaths: ["docs/**"]
