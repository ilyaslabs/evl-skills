name: Change a documented method's signature
skills: [evl-maintain, evl-validate]
fixture: shop
setup:
  write:
    docs/evl/inventory.evl.yaml: |
      evl: "1.0"
      components:
        - id: inventory.reservation-api
          name: Reservation API
          source: "com.example.shop.inventory.InventoryService#reserve(List)"
  commit: true
  replace:
    - file: src/main/java/com/example/shop/inventory/InventoryService.java
      old: "public boolean reserve(List<String> skus) {"
      new: "public boolean reserve(List<String> skus, String warehouse) {"
    - file: src/main/java/com/example/shop/order/OrderService.java
      old: "inventory.reserve(request.skus);"
      new: "inventory.reserve(request.skus, \"main\");"
prompt: >-
  I added a warehouse parameter to InventoryService.reserve. Update the EVL documentation so it stays correct.
checks:
  validate: true
  elements: [inventory.reservation-api, inventory.reserve]
  maxNewElements: 0
  allowedPaths: ["docs/**", "src/main/java/com/example/shop/inventory/**"]
