name: Existing project documentation
skills: [evl-fundamentals, evl-document]
fixture: shop
setup:
  stripEvl: true
  delete: [docs/evl]
prompt: >-
  This project already has an evl.yaml but no EVL documentation. Document its modules, components,
  dependencies, endpoint, request, data model, event and configuration. The payments API key is a secret.
checks:
  validate: true
  minKinds: { module: 2, component: 2, dependency: 1, endpoint: 1, request: 1, event: 1, config-property: 1 }
  diffContains: ["sensitive\\s*[=:]\\s*true"]
  allowedPaths: ["docs/**", "src/**", "evl.yaml"]
  noSecrets: true
