name: Business flow realized by technical flows
skills: [evl-workflows]
fixture: shop
prompt: >-
  Add a BUSINESS flow "order.checkout" for the customer checkout journey (browse cart, place order,
  receive confirmation). Link its steps to the existing technical flows and components with realizedBy.
checks:
  validate: true
  elements: [order.checkout]
  diffContains: ["realizedBy", "BUSINESS"]
  maxNewElements: 8
  allowedPaths: ["docs/**"]
