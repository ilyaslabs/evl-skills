name: Release

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Zip skills
        run: |
          mkdir -p dist
          for d in skills/*/; do n=$(basename "$d"); (cd skills && zip -qr "../dist/$n.zip" "$n"); done
          zip -qr dist/evl-skills.zip skills AGENTS.md LICENSE TRADEMARKS.md spec.lock .claude-plugin
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
