name: Pull Request Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read spec.lock
        id: lock
        run: echo "ref=$(grep '^ref:' spec.lock | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ilyaslabs/evl-lib
          ref: ${{ steps.lock.outputs.ref }}
          path: .evl-lib
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Lint skills
        run: python3 tools/lint.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: The EVL CLI reads the example
        working-directory: .evl-lib
        run: |
          ./gradlew -q :evl-cli:allJar
          java -jar evl-cli/build/libs/evl-cli-*-all.jar examples/media
      - name: Codex mirror matches
        run: diff -r skills codex/skills
